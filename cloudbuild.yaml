substitutions:
  _REGION: us-east1
  _SERVICE: vitarerum
  _REPOSITORY: vitarerum
  _IMAGE: vitarerum
  _SCIENTIFIC_RETURN_JOB: vitarerum-scientific-return
  _SCIENTIFIC_RETURN_LIMIT: '25'
  _SCIENTIFIC_RETURN_AGENT_LIMIT: '10'

steps:
  - name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - vitarerum-migrate
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
      - --region
      - ${_REGION}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - vitarerum-migrate
      - --region
      - ${_REGION}
      - --wait

  # Scheduled scientific-return sweep: deterministic search for every due watch,
  # then the autonomous investigations it queued, in one pass on one schedule.
  # Only the image is refreshed here; the cadence lives in Cloud Scheduler, which
  # executes this job. The entrypoint is overridden so a sweep never re-runs
  # migrations.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - ${_SCIENTIFIC_RETURN_JOB}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
      - --region
      - ${_REGION}
      - --command
      - python
      # Forma com '=' e' obrigatoria: o valor comeca com '-m', e na forma
      # separada o argparse do gcloud o le como outra flag, falhando com
      # "argument --args: expected one argument".
      - >-
        --args=-m,app.jobs.scientific_return,run-sweep,--limit,${_SCIENTIFIC_RETURN_LIMIT},--agent-limit,${_SCIENTIFIC_RETURN_AGENT_LIMIT}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
      - --region
      - ${_REGION}

# Um build que roda como conta de servico propria (--service-account) nao pode
# escrever logs no bucket legado do Cloud Build: ou se aponta --gcs-log-dir, ou
# se manda tudo para o Cloud Logging. Sem isto o build falha antes do 1o passo.
options:
  logging: CLOUD_LOGGING_ONLY
