substitutions:
  _REGION: us-east1
  _SERVICE: vitarerum
  _REPOSITORY: vitarerum
  _IMAGE: vitarerum
  _SCIENTIFIC_RETURN_JOB: vitarerum-scientific-return
  _SCIENTIFIC_RETURN_LIMIT: '25'

steps:
  - name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - vitarerum-migrate
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
      - --region
      - ${_REGION}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - vitarerum-migrate
      - --region
      - ${_REGION}
      - --wait

  # Scheduled scientific-return sweep. Only the image is refreshed here; the
  # cadence lives in Cloud Scheduler, which executes this job. The entrypoint is
  # overridden so a scheduled sweep never re-runs migrations.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - ${_SCIENTIFIC_RETURN_JOB}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
      - --region
      - ${_REGION}
      - --command
      - python
      - --args
      - -m,app.jobs.scientific_return,run-due,--limit,${_SCIENTIFIC_RETURN_LIMIT}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID
      - --region
      - ${_REGION}
