name: docs

# The documentation checks need no dependencies, no services and no secrets:
# standard-library Python over the tracked Markdown and the test tree. Kept
# separate from the application gates so a docs failure reads as a docs failure.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check documentation
        run: python3 scripts/check_docs.py
