services:
  postgres:
    image: postgres:16-alpine
    container_name: vitarerum-postgres
    environment:
      POSTGRES_DB: vitarerum
      POSTGRES_USER: vitarerum
      POSTGRES_PASSWORD: vitarerum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitarerum -d vitarerum"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
