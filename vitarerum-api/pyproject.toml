[project]
name = "vitarerum-api"
version = "0.1.0"
description = "Backend API for Vitarerum."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=3.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.0",
    "docxtpl>=0.20.2",
    "email-validator>=2.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "langchain-ollama>=1.1.0",
    "openpyxl>=3.1.0",
    "owlrl>=7.1.4",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.9.0",
    "pyshacl>=0.31.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.29",
    "rdflib>=7.6.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "debugpy>=1.8.21",
    "httpx>=0.27.0",
    "import-linter>=2.11",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "types-openpyxl>=3.1.5.20260518",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]

[tool.ruff]
line-length = 88
target-version = "py312"
# Generated migration DDL (long CREATE TYPE/TABLE statements) is not hand-written
# application code; mypy already excludes it.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["alembic/versions"]

# Ollama / owlrl / docxtpl ship no type stubs; imported lazily by adapters.
[[tool.mypy.overrides]]
module = ["langchain_ollama.*", "langchain_core.*", "owlrl.*", "docxtpl.*"]
ignore_missing_imports = true

# ── Architecture fitness function (HEXAGONAL_UP.md Step 0) ───────────────────
# Whitelisted entries marked TEMP are known violations scheduled for removal in
# the step named next to them; the contract direction is the target state.

[tool.importlinter]
root_package = "app"
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Use of Collections layers (presentation > infrastructure > application > domain)"
type = "layers"
layers = [
    "app.use_of_collections.presentation",
    "app.use_of_collections.infrastructure",
    "app.use_of_collections.application",
    "app.use_of_collections.domain",
]
[[tool.importlinter.contracts]]
name = "Identity layers (presentation > infrastructure > application)"
type = "layers"
layers = [
    "app.identity.presentation",
    "app.identity.infrastructure",
    "app.identity.application",
    "app.identity.domain",
]

[[tool.importlinter.contracts]]
name = "Public submission layers (presentation > infrastructure > application > domain)"
type = "layers"
layers = [
    "app.public_submission.presentation",
    "app.public_submission.infrastructure",
    "app.public_submission.application",
    "app.public_submission.domain",
]

[[tool.importlinter.contracts]]
name = "Public submission may import other contexts only via published language"
type = "forbidden"
source_modules = ["app.public_submission"]
forbidden_modules = [
    "app.identity",
    "app.use_of_collections",
    "app.reference_numbers",
    "app.cidoc_crm",
    "app.museum_questions",
    "app.notifications",
]
ignore_imports = [
    # Known composition-root coupling: the public intake adapter wires other
    # contexts' repositories/use cases directly to materialise the proposal.
    # Tracked for extraction behind published ingestion facades; these ignores
    # stop NEW drift meanwhile.
    "app.public_submission.application.use_cases -> app.use_of_collections.application.use_cases",
    "app.public_submission.application.use_cases -> app.use_of_collections.domain.enums",
    "app.public_submission.application.use_cases -> app.use_of_collections.domain.models",
    "app.public_submission.presentation.dependencies -> app.use_of_collections.application.use_cases",
    "app.public_submission.presentation.dependencies -> app.use_of_collections.infrastructure.repositories",
    "app.public_submission.presentation.dependencies -> app.reference_numbers.public",
    # Amendment (document-correction) channel: the public context owns the token
    # + e-mail and drives the Use of Collections amendment use cases; its adapter
    # structurally implements AmendmentInvitationPort (defined in Use of
    # Collections) and references its ProposalRepository/ProposalId. Same
    # composition-root coupling as the intake path above.
    "app.public_submission.presentation.dependencies -> app.identity.public",
    "app.public_submission.infrastructure.amendment -> app.use_of_collections.application.ports",
    "app.public_submission.infrastructure.amendment -> app.use_of_collections.domain.models",
    "app.public_submission.presentation.dependencies -> app.use_of_collections.application.ports",
    "app.public_submission.presentation.dependencies -> app.use_of_collections.infrastructure.proposal_notification_email",
    "app.public_submission.** -> app.notifications.public",
    "app.public_submission.presentation.routes -> app.use_of_collections.application.use_cases",
    "app.public_submission.presentation.routes -> app.use_of_collections.domain.enums",
    "app.public_submission.presentation.routes -> app.use_of_collections.domain.models",
]

[[tool.importlinter.contracts]]
name = "Reference Numbers layers (presentation > infrastructure > application > domain)"
type = "layers"
layers = [
    "app.reference_numbers.presentation",
    "app.reference_numbers.infrastructure",
    "app.reference_numbers.application",
    "app.reference_numbers.domain",
]

[[tool.importlinter.contracts]]
name = "Use of Collections may import Reference Numbers only via reference_numbers.public"
type = "forbidden"
source_modules = ["app.use_of_collections"]
forbidden_modules = ["app.reference_numbers"]
ignore_imports = [
    "app.use_of_collections.** -> app.reference_numbers.public",
]

[[tool.importlinter.contracts]]
name = "Museum Narrative layers (presentation > infrastructure > application > domain)"
type = "layers"
layers = [
    "app.ai.museum_narrative.presentation",
    "app.ai.museum_narrative.infrastructure",
    "app.ai.museum_narrative.application",
    "app.ai.museum_narrative.domain",
]

[[tool.importlinter.contracts]]
name = "Museum Narrative may import CIDOC-CRM only via cidoc_crm.public"
type = "forbidden"
source_modules = ["app.ai"]
forbidden_modules = ["app.cidoc_crm"]
ignore_imports = [
    # Permanent: cidoc_crm.public is the published language the AI context uses.
    "app.ai.** -> app.cidoc_crm.public",
]

[[tool.importlinter.contracts]]
name = "AI Prompts layers (presentation > infrastructure > application > domain)"
type = "layers"
layers = [
    "app.ai.prompts.presentation",
    "app.ai.prompts.infrastructure",
    "app.ai.prompts.application",
    "app.ai.prompts.domain",
]

[[tool.importlinter.contracts]]
name = "AI Prompt consumers may import prompts only via prompts.public"
type = "forbidden"
source_modules = ["app.ai.museum_narrative"]
forbidden_modules = [
    "app.ai.prompts.application",
    "app.ai.prompts.domain",
    "app.ai.prompts.infrastructure",
    "app.ai.prompts.presentation",
]
ignore_imports = [
    "app.ai.museum_narrative.infrastructure.prompt_acl -> app.ai.prompts.public",
]

[[tool.importlinter.contracts]]
name = "Reports layers (presentation > infrastructure > application > domain)"
type = "layers"
layers = [
    "app.reports.in_situ_visit.presentation",
    "app.reports.in_situ_visit.infrastructure",
    "app.reports.in_situ_visit.application",
    "app.reports.in_situ_visit.domain",
]

[[tool.importlinter.contracts]]
name = "Reports may import other contexts only via their published language"
type = "forbidden"
source_modules = ["app.reports"]
forbidden_modules = ["app.cidoc_crm", "app.ai", "app.museum_questions"]
ignore_imports = [
    # Permanent: the published languages are the report aggregator's only doors
    # into the record (CIDOC-CRM) and narrative (KG-RAG) contexts.
    "app.reports.in_situ_visit.infrastructure.readers -> app.cidoc_crm.public",
    "app.reports.in_situ_visit.infrastructure.readers -> app.ai.museum_narrative.public",
    # The route maps public error vocabularies returned by those facades.
    "app.reports.in_situ_visit.presentation.routes -> app.cidoc_crm.public",
    "app.reports.in_situ_visit.presentation.routes -> app.ai.museum_narrative.public",
    # The detail response embeds the two contexts' published presentation DTOs
    # (single source of truth for the record/narrative shapes) instead of
    # re-declaring them.
    "app.reports.in_situ_visit.presentation.schemas -> app.cidoc_crm.in_situ_visit_mapping.presentation.schemas",
    "app.reports.in_situ_visit.presentation.schemas -> app.ai.museum_narrative.presentation.schemas",
    "app.reports.public -> app.cidoc_crm.public",
    "app.reports.public -> app.reports.in_situ_visit.infrastructure.readers",
    "app.reports.public -> app.reports.in_situ_visit.infrastructure.repositories",
]

[[tool.importlinter.contracts]]
name = "External Publications layers (presentation > infrastructure > application > domain)"
type = "layers"
layers = [
    "app.external_publications.presentation",
    "app.external_publications.infrastructure",
    "app.external_publications.application",
    "app.external_publications.domain",
]

[[tool.importlinter.contracts]]
name = "Scientific Return layers (presentation > infrastructure > application > domain)"
type = "layers"
layers = [
    "app.scientific_return.presentation",
    "app.scientific_return.infrastructure",
    "app.scientific_return.application",
    "app.scientific_return.domain",
]

[[tool.importlinter.contracts]]
name = "Scientific Return may import workflows only via published language"
type = "forbidden"
source_modules = ["app.scientific_return"]
forbidden_modules = ["app.use_of_collections", "app.identity"]
ignore_imports = [
    "app.scientific_return.** -> app.use_of_collections.public",
    "app.scientific_return.** -> app.identity.public",
    "app.shared.authorization -> app.identity.public",
    "app.shared.dependencies -> app.identity.public",
]

[[tool.importlinter.contracts]]
name = "External Publications may import resource contexts only via published language"
type = "forbidden"
source_modules = ["app.external_publications"]
forbidden_modules = [
    "app.use_of_collections",
    "app.reports",
    "app.cidoc_crm",
    "app.ai",
]
ignore_imports = [
    "app.external_publications.infrastructure.acls -> app.use_of_collections.public",
    "app.external_publications.infrastructure.acls -> app.reports.public",
]

[[tool.importlinter.contracts]]
name = "Document templates layers (presentation > infrastructure > application > domain)"
type = "layers"
layers = [
    "app.document_templates.presentation",
    "app.document_templates.infrastructure",
    "app.document_templates.application",
    "app.document_templates.domain",
]

[[tool.importlinter.contracts]]
name = "Document templates may not depend on other contexts"
type = "forbidden"
source_modules = ["app.document_templates"]
forbidden_modules = [
    "app.use_of_collections",
    "app.cidoc_crm",
    "app.ai",
    "app.public_submission",
    "app.museum_questions",
]

[[tool.importlinter.contracts]]
name = "Document templates may import Identity only via identity.public"
type = "forbidden"
source_modules = ["app.document_templates"]
forbidden_modules = ["app.identity"]
ignore_imports = [
    # Permanent: identity.public is the published language, reached through the
    # shared staff-auth helpers (CallerPermission / require_staff).
    "app.shared.authorization -> app.identity.public",
    "app.shared.dependencies -> app.identity.public",
]

[[tool.importlinter.contracts]]
name = "Collection object index layers (presentation > infrastructure > application > domain)"
type = "layers"
layers = [
    "app.collection_object_index.presentation",
    "app.collection_object_index.infrastructure",
    "app.collection_object_index.application",
    "app.collection_object_index.domain",
]

[[tool.importlinter.contracts]]
name = "Collection object index may not depend on other contexts"
type = "forbidden"
source_modules = ["app.collection_object_index"]
forbidden_modules = [
    "app.use_of_collections",
    "app.cidoc_crm",
    "app.ai",
    "app.public_submission",
    "app.document_templates",
    "app.museum_questions",
]

[[tool.importlinter.contracts]]
name = "Museum questions layers (presentation > infrastructure > application > domain)"
type = "layers"
layers = [
    "app.museum_questions.presentation",
    "app.museum_questions.infrastructure",
    "app.museum_questions.application",
    "app.museum_questions.domain",
]

[[tool.importlinter.contracts]]
name = "Museum questions may not depend on other contexts"
type = "forbidden"
source_modules = ["app.museum_questions"]
forbidden_modules = [
    "app.use_of_collections",
    "app.cidoc_crm",
    "app.ai",
    "app.public_submission",
    "app.document_templates",
    "app.collection_object_index",
    "app.notifications",
]
ignore_imports = [
    "app.museum_questions.** -> app.notifications.public",
]

[[tool.importlinter.contracts]]
name = "Museum questions may import Identity only via identity.public"
type = "forbidden"
source_modules = ["app.museum_questions"]
forbidden_modules = ["app.identity"]
ignore_imports = [
    # Permanent: identity.public is the published language, reached through the
    # shared staff-auth helpers (CallerPermission / require_staff) — needed once
    # the internal response section (museum-questions-response-section-plan.md)
    # adds its authenticated endpoints.
    "app.museum_questions.application.read_models -> app.identity.public",
    "app.museum_questions.application.use_cases -> app.identity.public",
    "app.museum_questions.presentation.commands -> app.identity.public",
    "app.museum_questions.presentation.dependencies -> app.identity.public",
    "app.museum_questions.presentation.routes -> app.identity.public",
    "app.museum_questions.presentation.schemas -> app.identity.public",
    "app.shared.authorization -> app.identity.public",
    "app.shared.dependencies -> app.identity.public",
]

[[tool.importlinter.contracts]]
name = "Notifications layers (presentation > infrastructure > application > domain)"
type = "layers"
layers = [
    "app.notifications.presentation",
    "app.notifications.infrastructure",
    "app.notifications.application",
    "app.notifications.domain",
    "app.scientific_return.domain",
]

[[tool.importlinter.contracts]]
name = "Notifications may import Identity only via identity.public"
type = "forbidden"
source_modules = ["app.notifications"]
forbidden_modules = ["app.identity"]
ignore_imports = [
    "app.notifications.** -> app.identity.public",
    "app.shared.authorization -> app.identity.public",
    "app.shared.dependencies -> app.identity.public",
]

[[tool.importlinter.contracts]]
name = "Domain purity (no frameworks in domain)"
type = "forbidden"
source_modules = [
    "app.use_of_collections.domain",
    "app.ai.museum_narrative.domain",
    "app.ai.prompts.domain",
    "app.cidoc_crm.in_situ_visit_mapping.domain",
    "app.reports.in_situ_visit.domain",
    "app.public_submission.domain",
    "app.document_templates.domain",
    "app.collection_object_index.domain",
    "app.museum_questions.domain",
    "app.external_publications.domain",
    "app.notifications.domain",
]
forbidden_modules = ["fastapi", "sqlalchemy", "pydantic"]

[[tool.importlinter.contracts]]
name = "Application purity (no frameworks in application)"
type = "forbidden"
source_modules = [
    "app.use_of_collections.application",
    "app.identity.application",
    "app.ai.museum_narrative.application",
    "app.ai.prompts.application",
    "app.cidoc_crm.in_situ_visit_mapping.application",
    "app.reports.in_situ_visit.application",
    "app.public_submission.application",
    "app.document_templates.application",
    "app.collection_object_index.application",
    "app.museum_questions.application",
    "app.external_publications.application",
    "app.notifications.application",
    "app.scientific_return.application",
]
forbidden_modules = ["fastapi", "sqlalchemy"]
ignore_imports = [
    # Lazy composition hooks inside the *.public OHS modules (function-level
    # imports); applications never execute them — only inbound adapters do.
    "app.identity.public -> app.identity.infrastructure.repositories",
    "app.use_of_collections.public -> app.use_of_collections.infrastructure.repositories",
    "app.reference_numbers.public -> app.reference_numbers.infrastructure.repositories",
    "app.notifications.public -> app.notifications.application.dispatch",
    "app.notifications.public -> app.notifications.infrastructure.repositories",
]

[[tool.importlinter.contracts]]
name = "Identity must not depend on Use of Collections"
type = "forbidden"
source_modules = ["app.identity"]
forbidden_modules = ["app.use_of_collections"]

[[tool.importlinter.contracts]]
name = "Use of Collections may import Identity only via identity.public"
type = "forbidden"
source_modules = ["app.use_of_collections"]
forbidden_modules = ["app.identity"]
ignore_imports = [
    # Permanent: identity.public is the published language other contexts may use
    "app.use_of_collections.** -> app.identity.public",
    "app.shared.authorization -> app.identity.public",
    "app.shared.dependencies -> app.identity.public",
    # Lazy composition hook inside reference_numbers.public (function-level
    # import) transitively reaches identity.public through
    # reference_numbers.application.use_cases; same shape as the hooks above.
    "app.reference_numbers.public -> app.reference_numbers.application.use_cases",
]

[[tool.importlinter.contracts]]
name = "Use of Collections may import Notifications only via notifications.public"
type = "forbidden"
source_modules = ["app.use_of_collections"]
forbidden_modules = ["app.notifications"]
ignore_imports = [
    "app.use_of_collections.** -> app.notifications.public",
]

[[tool.importlinter.contracts]]
name = "Core contexts must not depend on AI contexts"
type = "forbidden"
source_modules = ["app.identity", "app.use_of_collections", "app.public_submission"]
forbidden_modules = ["app.ai"]

[[tool.importlinter.contracts]]
name = "CIDOC-CRM layers (presentation > infrastructure > application > domain)"
type = "layers"
layers = [
    "app.cidoc_crm.in_situ_visit_mapping.presentation",
    "app.cidoc_crm.in_situ_visit_mapping.infrastructure",
    "app.cidoc_crm.in_situ_visit_mapping.application",
    "app.cidoc_crm.in_situ_visit_mapping.domain",
]

[[tool.importlinter.contracts]]
name = "CIDOC-CRM may import Use of Collections only via use_of_collections.public"
type = "forbidden"
source_modules = ["app.cidoc_crm"]
forbidden_modules = ["app.use_of_collections"]
ignore_imports = [
    # The export ACL reads the project through the published OHS only.
    "app.cidoc_crm.** -> app.use_of_collections.public",
]

[[tool.importlinter.contracts]]
name = "Shared kernel imports stdlib only"
type = "forbidden"
source_modules = ["app.shared.kernel"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "pydantic",
    "app.use_of_collections",
    "app.identity",
    "app.ai",
    "app.public_submission",
]
