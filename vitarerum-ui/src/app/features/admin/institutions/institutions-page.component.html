<div class="institutions-page">
  <app-page-header eyebrow="Administration" title="Institutions">
    <button pButton type="button" (click)="createInstitution()">
      <span class="pi pi-plus" aria-hidden="true"></span>
      New institution
    </button>
  </app-page-header>

  @if (institutionsResource.isLoading()) {
    <app-loading-state />
  } @else if (apiError()) {
    <app-error-message [apiError]="apiError()!" (retry)="institutionsResource.reload()" />
  } @else if (!institutions().length) {
    <app-empty-state
      title="No institutions found"
      message="Create the first institution to get started."
    />
  } @else {
    <app-data-table ariaLabel="Institutions">
      <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col" class="is-secondary">Email</th>
          <th scope="col" class="is-secondary">Phone</th>
          <th scope="col" class="sr-only">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (institution of institutions(); track institution.id) {
          <tr>
            <td>
              <a class="data-table__link" [routerLink]="institution.id">
                {{ institution.name }}
              </a>
            </td>
            <td class="data-table__muted is-secondary">{{ institution.email || '—' }}</td>
            <td class="data-table__muted data-table__num is-secondary">
              {{ institution.phone || '—' }}
            </td>
            <td class="data-table__actions">
              <app-row-actions
                [items]="actionItemsFor(institution)"
                ariaLabel="More actions for {{ institution.name }}"
              />
            </td>
          </tr>
        }
      </tbody>
    </app-data-table>

    <app-pagination
      [page]="currentPage()"
      [totalPages]="totalPages()"
      [total]="total()"
      [pageSize]="pageSize"
      itemLabel="institutions"
      (previous)="prevPage()"
      (next)="nextPage()"
    />
  }
</div>
