<div class="user-new">
  <a class="user-new__back" routerLink="/p/admin/users">← Back to users</a>

  <app-page-header
    eyebrow="User"
    title="New user"
    description="Create the account, then assign it to one or more groups on the next screen."
  />

  <form class="user-form" (submit)="save($event)">
    @if (saveError()) {
      <app-error-message [apiError]="saveError()!" />
    }

    <app-form-field label="Name" controlId="user-name" [field]="userForm.name">
      <input
        id="user-name"
        type="text"
        autocomplete="name"
        [formField]="userForm.name"
        aria-describedby="user-name-error"
      />
    </app-form-field>

    <app-form-field label="Email" controlId="user-email" [field]="userForm.email">
      <input
        id="user-email"
        type="email"
        autocomplete="email"
        [formField]="userForm.email"
        aria-describedby="user-email-error"
      />
    </app-form-field>

    <app-form-field label="Password" controlId="user-password" [field]="userForm.password">
      <input
        id="user-password"
        type="password"
        autocomplete="new-password"
        [formField]="userForm.password"
        aria-describedby="user-password-error"
      />
    </app-form-field>

    <div class="user-form__actions">
      <button
        pButton
        type="button"
        class="p-button-text"
        [disabled]="pending()"
        (click)="cancel()"
      >
        Cancel
      </button>
      <button pButton type="submit" [disabled]="saveDisabled()">
        @if (pending()) {
          <span class="pi pi-spin pi-spinner" aria-hidden="true"></span>
          Creating…
        } @else {
          Create user
        }
      </button>
    </div>
  </form>
</div>
