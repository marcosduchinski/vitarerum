<div class="change-password">
  <app-page-header
    eyebrow="Account"
    title="Change password"
    description="You'll be signed out and asked to sign in again with your new password."
  />

  <form class="change-password-form" (submit)="submit($event)">
    @if (saveError()) {
      <app-error-message [apiError]="saveError()!" />
    }

    <app-form-field
      label="Current password"
      controlId="current-password"
      [field]="changePasswordForm.currentPassword"
    >
      <input
        id="current-password"
        type="password"
        autocomplete="current-password"
        [formField]="changePasswordForm.currentPassword"
        aria-describedby="current-password-error"
      />
    </app-form-field>

    <app-form-field
      label="New password"
      controlId="new-password"
      [field]="changePasswordForm.newPassword"
    >
      <input
        id="new-password"
        type="password"
        autocomplete="new-password"
        [formField]="changePasswordForm.newPassword"
        aria-describedby="new-password-error"
      />
    </app-form-field>

    <app-form-field
      label="Confirm new password"
      controlId="confirm-password"
      [field]="changePasswordForm.confirmPassword"
    >
      <input
        id="confirm-password"
        type="password"
        autocomplete="new-password"
        [formField]="changePasswordForm.confirmPassword"
        aria-describedby="confirm-password-error"
      />
    </app-form-field>

    <div class="change-password-form__actions">
      <button pButton type="submit" [disabled]="saveDisabled()">
        @if (pending()) {
          <span class="pi pi-spin pi-spinner" aria-hidden="true"></span>
          Changing…
        } @else {
          Change password
        }
      </button>
    </div>
  </form>
</div>
