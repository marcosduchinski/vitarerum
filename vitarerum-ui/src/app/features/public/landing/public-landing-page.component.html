<div class="public-landing">
  <app-page-header
    eyebrow="Welcome"
    title="How can we help?"
    description="Choose the option that best fits what you need — a quick question, or a formal request to access our collections."
  />

  <div class="choices">
    <a class="choice" routerLink="/ask-museum">
      <span class="choice__icon pi pi-question-circle" aria-hidden="true"></span>
      <span class="choice__title">Ask the Museum</span>
      <span class="choice__desc">
        Have a simple question about our collections, especially in-situ visits for research? Ask
        here and we'll reply by e-mail.
      </span>
    </a>

    <a class="choice" routerLink="/submit-proposal">
      <span class="choice__icon pi pi-file-edit" aria-hidden="true"></span>
      <span class="choice__title">Request an in-situ visit</span>
      <span class="choice__desc">
        Submit a formal proposal to access our collections, with dates, supporting documents, and
        confirmation.
      </span>
    </a>
  </div>
</div>
