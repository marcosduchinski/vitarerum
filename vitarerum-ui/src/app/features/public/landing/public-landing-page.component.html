<div class="public-landing">
  <app-page-header
    [eyebrow]="'public.landing.eyebrow' | t"
    [title]="'public.landing.title' | t"
    [description]="'public.landing.description' | t"
  />

  <div class="choices">
    <a class="choice" routerLink="/ask-museum">
      <span class="choice__icon pi pi-question-circle" aria-hidden="true"></span>
      <span class="choice__title">{{ 'public.landing.askMuseum.title' | t }}</span>
      <span class="choice__desc">{{ 'public.landing.askMuseum.description' | t }}</span>
    </a>

    <a class="choice" routerLink="/submit-proposal">
      <span class="choice__icon pi pi-file-edit" aria-hidden="true"></span>
      <span class="choice__title">{{ 'public.landing.submitProposal.title' | t }}</span>
      <span class="choice__desc">{{ 'public.landing.submitProposal.description' | t }}</span>
    </a>
  </div>
</div>
