<svg viewBox="0 0 31 22" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <g class="agent-flow__robot" [attr.transform]="'translate(' + robotShift() + ', 3)'">
    <path d="M7 3 V6" />
    <circle cx="7" cy="1.9" r="1.3" fill="currentColor" stroke="none" />
    <rect x="0.9" y="6" width="12.2" height="13" rx="3.2" />
    <circle cx="4.6" cy="11.6" r="1.45" fill="currentColor" stroke="none" />
    <circle cx="9.4" cy="11.6" r="1.45" fill="currentColor" stroke="none" />
    <path d="M4.8 15.6 H9.2" />
    <path d="M0 10.8 V14.2" />
    <path d="M14 10.8 V14.2" />
  </g>

  @if (flow() === 'out') {
    <g class="agent-flow__balloon" transform="translate(17, 0)">
      <path
        d="M4.1 1.5 H9.9 A3.2 3.2 0 0 1 13.1 4.7 V9.3 A3.2 3.2 0 0 1 9.9 12.5
           H8 L2.6 17 L4.2 12.5 A3.2 3.2 0 0 1 0.9 9.3 V4.7 A3.2 3.2 0 0 1 4.1 1.5 Z"
      />
    </g>
  } @else {
    <g class="agent-flow__waves">
      <path d="M3 6 Q6.2 11 3 16" />
      <path d="M7.4 3.4 Q11.6 11 7.4 18.6" />
      <path d="M11.8 1 Q16.6 11 11.8 21" />
    </g>
  }
</svg>
