substitutions:
  _REGION: us-east1
  _REPOSITORY: vitarerum
  _IMAGE: vitarerum
  _TAG: manual

steps:
  - name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_TAG}

# Um build que roda como conta de servico propria (--service-account) nao pode
# escrever logs no bucket legado do Cloud Build: ou se aponta --gcs-log-dir, ou
# se manda tudo para o Cloud Logging. Sem isto o build falha antes do 1o passo.
options:
  logging: CLOUD_LOGGING_ONLY
