<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="3864" viewBox="0 0 1800 3864">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#061a36" flood-opacity="0.13"/></filter>
    <marker id="a" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0 0L14 7 0 14z" fill="#7b8798"/></marker>
  </defs>
  <rect width="1800" height="3864" rx="50" fill="#f4f7fb"/>
  <text x="120" y="145" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#061a36">Publicar um prompt</text>
  <text x="120" y="220" font-family="Arial, sans-serif" font-size="38" fill="#52647a">Um fluxo seguro, versionado e auditável.</text>
  <g stroke="#7b8798" stroke-width="14" fill="none" marker-end="url(#a)"><path d="M900 710v135"/><path d="M900 1420v135"/><path d="M900 2210v135"/><path d="M900 3015v135"/></g>

  <g font-family="Arial, sans-serif" filter="url(#s)">
    <g transform="translate(180 340)"><rect width="1440" height="370" rx="55" fill="#fff"/><circle cx="125" cy="125" r="68" fill="#0c5ea8"/><path d="M83 125h84M125 83v84" stroke="#fff" stroke-width="18" stroke-linecap="round"/><text x="235" y="108" font-size="55" font-weight="700" fill="#0b2648">1. Criar um rascunho</text><text x="235" y="170" font-size="34" fill="#52647a">Comece do zero ou duplique a versão ativa.</text><rect x="235" y="230" width="330" height="72" rx="36" fill="#e9f3fc"/><text x="400" y="278" text-anchor="middle" font-size="31" font-weight="700" fill="#0c5ea8">DRAFT</text></g>
    <g transform="translate(180 850)"><rect width="1440" height="570" rx="55" fill="#fff"/><circle cx="125" cy="125" r="68" fill="#287f8e"/><path d="M84 169l14-42 55-55 31 31-55 55zM98 127l31 31" fill="none" stroke="#fff" stroke-width="14" stroke-linejoin="round"/><text x="235" y="108" font-size="55" font-weight="700" fill="#0b2648">2. Editar e testar</text><text x="235" y="170" font-size="34" fill="#52647a">Ajuste o conteúdo, o rótulo e a temperatura.</text><rect x="235" y="235" width="1030" height="205" rx="30" fill="#e8f6f6"/><circle cx="315" cy="337" r="44" fill="#287f8e"/><path d="M292 337l17 18 34-42" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/><text x="390" y="323" font-size="32" font-weight="700" fill="#0b2648">Banco de testes</text><text x="390" y="368" font-size="28" fill="#52647a">Disponível para prompts de narrativa de visita.</text><text x="235" y="505" font-size="27" fill="#52647a">Testar não altera o comportamento em produção.</text></g>
    <g transform="translate(180 1560)"><rect width="1440" height="650" rx="55" fill="#fff"/><circle cx="125" cy="125" r="68" fill="#fc4c16"/><path d="M125 76v48M125 124l-38 40M125 124l38 40" stroke="#fff" stroke-width="15" stroke-linecap="round"/><circle cx="87" cy="164" r="8" fill="#fff"/><circle cx="163" cy="164" r="8" fill="#fff"/><text x="235" y="108" font-size="55" font-weight="700" fill="#0b2648">3. Escolher o destino</text><text x="235" y="170" font-size="34" fill="#52647a">O rascunho pode ser arquivado ou publicado.</text><g transform="translate(150 260)"><rect width="500" height="260" rx="40" fill="#f2f4f8" stroke="#8793a5" stroke-width="5"/><text x="250" y="100" text-anchor="middle" font-size="41" font-weight="700" fill="#52647a">Arquivar</text><text x="250" y="155" text-anchor="middle" font-size="28" fill="#6b7788">Sai do fluxo sem</text><text x="250" y="194" text-anchor="middle" font-size="28" fill="#6b7788">entrar em produção</text></g><g transform="translate(790 260)"><rect width="500" height="260" rx="40" fill="#fff0ea" stroke="#fc4c16" stroke-width="6"/><text x="250" y="100" text-anchor="middle" font-size="41" font-weight="700" fill="#b53d16">Publicar</text><text x="250" y="155" text-anchor="middle" font-size="28" fill="#765440">Torna-se a nova</text><text x="250" y="194" text-anchor="middle" font-size="28" fill="#765440">versão ativa</text></g></g>
    <g transform="translate(180 2350)"><rect width="1440" height="665" rx="55" fill="#fff"/><circle cx="125" cy="125" r="68" fill="#21835b"/><path d="M84 127l31 31 58-73" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round"/><text x="235" y="108" font-size="55" font-weight="700" fill="#0b2648">4. Publicação atómica</text><text x="235" y="170" font-size="34" fill="#52647a">A troca acontece numa única operação.</text><g transform="translate(175 260)"><rect width="430" height="220" rx="38" fill="#f2f4f8"/><text x="215" y="85" text-anchor="middle" font-size="32" font-weight="700" fill="#52647a">Versão anterior</text><rect x="95" y="125" width="240" height="62" rx="31" fill="#dfe4ea"/><text x="215" y="167" text-anchor="middle" font-size="27" font-weight="700" fill="#687586">ARCHIVED</text></g><path d="M700 370h160" stroke="#7b8798" stroke-width="14" marker-end="url(#a)"/><g transform="translate(850 260)"><rect width="430" height="220" rx="38" fill="#e8f6ef"/><text x="215" y="85" text-anchor="middle" font-size="32" font-weight="700" fill="#0b2648">Novo rascunho</text><rect x="95" y="125" width="240" height="62" rx="31" fill="#21835b"/><text x="215" y="167" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">PUBLISHED</text></g><text x="720" y="560" text-anchor="middle" font-size="28" fill="#52647a">Nunca ficam duas versões publicadas do mesmo modelo.</text></g>
    <g transform="translate(180 3150)"><rect width="1440" height="500" rx="55" fill="#fff"/><circle cx="125" cy="125" r="68" fill="#4d63a8"/><path d="M84 112h82v76H84zM103 86h44" fill="none" stroke="#fff" stroke-width="14" stroke-linejoin="round"/><text x="235" y="108" font-size="55" font-weight="700" fill="#0b2648">5. Manter o histórico</text><text x="235" y="170" font-size="34" fill="#52647a">Cada resultado aponta para a versão exata usada.</text><rect x="235" y="250" width="1000" height="120" rx="28" fill="#edf0fb"/><text x="735" y="303" text-anchor="middle" font-size="29" font-weight="700" fill="#4d63a8">Uma versão publicada não é arquivada diretamente.</text><text x="735" y="343" text-anchor="middle" font-size="27" fill="#52647a">Para a substituir, publique um novo rascunho.</text></g>
  </g>
</svg>
