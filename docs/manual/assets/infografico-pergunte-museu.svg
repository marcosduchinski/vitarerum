<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1815" viewBox="0 0 1800 1815">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#061a36" flood-opacity="0.12"/></filter>
    <marker id="a" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto"><path d="M0 0L13 6.5 0 13z" fill="#7b8798"/></marker>
  </defs>
  <rect width="1800" height="1815" rx="40" fill="#f4f7fb"/>
  <text x="90" y="95" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#061a36">Como uma pergunta é tratada</text>
  <text x="90" y="150" font-family="Arial, sans-serif" font-size="28" fill="#52647a">Um canal simples, com uma resposta por email.</text>
  <g stroke="#7b8798" stroke-width="10" fill="none" marker-end="url(#a)"><path d="M900 360v80"/><path d="M900 650v80"/><path d="M900 940v70"/></g>
  <g font-family="Arial, sans-serif" filter="url(#s)">
    <g transform="translate(330 210)"><rect width="1140" height="150" rx="34" fill="#fff"/><circle cx="80" cy="75" r="48" fill="#0c5ea8"/><path d="M55 80c10-35 40-35 50 0M67 58a13 13 0 1 0 26 0" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/><text x="155" y="66" font-size="36" font-weight="700" fill="#0b2648">1. A pessoa envia a pergunta</text><text x="155" y="111" font-size="23" fill="#52647a">Pode anexar imagens. Não existe confirmação por email.</text></g>
    <g transform="translate(330 440)"><rect width="1140" height="210" rx="34" fill="#fff"/><rect width="245" height="210" rx="34" fill="#4d63a8"/><text x="123" y="92" text-anchor="middle" font-size="25" fill="#e4e8fa">ESTADO</text><text x="123" y="137" text-anchor="middle" font-size="29" font-weight="700" fill="#fff">SUBMITTED</text><text x="300" y="76" font-size="36" font-weight="700" fill="#0b2648">2. A equipa recebe e avalia</text><text x="300" y="125" font-size="25" fill="#52647a">O prazo de resposta é de 15 dias.</text><text x="300" y="166" font-size="22" fill="#52647a">Se ficar em atraso, a equipa responsável pode ser notificada.</text></g>
    <g transform="translate(330 730)"><rect width="1140" height="210" rx="34" fill="#fff"/><rect width="245" height="210" rx="34" fill="#287f8e"/><text x="123" y="92" text-anchor="middle" font-size="25" fill="#e0f5f5">ESTADO</text><text x="123" y="137" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">IN_PROGRESS</text><text x="300" y="76" font-size="36" font-weight="700" fill="#0b2648">3. Encaminhar, se necessário</text><text x="300" y="125" font-size="25" fill="#52647a">A pergunta fica atribuída a um membro da equipa.</text><text x="300" y="166" font-size="22" fill="#52647a">Também é possível responder diretamente em SUBMITTED.</text></g>
  </g>

  <text x="900" y="1065" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#0b2648">4. Dar uma resposta final</text>
  <g font-family="Arial, sans-serif" filter="url(#s)">
    <g transform="translate(120 1110)"><rect width="760" height="380" rx="35" fill="#fff" stroke="#21835b" stroke-width="5"/><circle cx="78" cy="76" r="46" fill="#21835b"/><path d="M52 78l20 20 39-49" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/><text x="150" y="68" font-size="36" font-weight="700" fill="#0b2648">Responder</text><text x="150" y="110" font-size="24" font-weight="700" fill="#21835b">ANSWERED</text><text x="55" y="175" font-size="24" fill="#52647a">A resposta é enviada por email.</text><path d="M210 255h340" stroke="#7b8798" stroke-width="8" marker-end="url(#a)"/><rect x="245" y="285" width="270" height="60" rx="30" fill="#e8f6ef"/><text x="380" y="325" text-anchor="middle" font-size="24" font-weight="700" fill="#21835b">CLOSED</text></g>
    <g transform="translate(920 1110)"><rect width="760" height="380" rx="35" fill="#fff" stroke="#b69a75" stroke-width="5" stroke-dasharray="18 12"/><circle cx="78" cy="76" r="46" fill="#a67843"/><text x="78" y="89" text-anchor="middle" font-size="42" font-weight="700" fill="#fff">!</text><text x="150" y="68" font-size="36" font-weight="700" fill="#0b2648">Fora do âmbito</text><text x="150" y="110" font-size="24" font-weight="700" fill="#a67843">OUT_OF_SCOPE</text><text x="55" y="175" font-size="24" fill="#52647a">Envia uma mensagem padrão.</text><path d="M210 255h340" stroke="#7b8798" stroke-width="8" marker-end="url(#a)"/><rect x="245" y="285" width="270" height="60" rx="30" fill="#f5eee5"/><text x="380" y="325" text-anchor="middle" font-size="24" font-weight="700" fill="#87623c">CLOSED</text></g>
  </g>
  <rect x="120" y="1550" width="1560" height="170" rx="28" fill="#fff5e9" stroke="#f0b36d" stroke-width="4"/>
  <circle cx="190" cy="1635" r="34" fill="#fc4c16"/><text x="190" y="1648" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#fff">i</text>
  <text x="250" y="1619" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#7a351c">Situação atual da interface</text>
  <text x="250" y="1662" font-family="Arial, sans-serif" font-size="23" fill="#765440">O serviço suporta “Fora do âmbito”, mas esta ação está temporariamente indisponível no ecrã.</text>
</svg>
